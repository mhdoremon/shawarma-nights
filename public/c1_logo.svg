<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Vibrant Electric Gradient for C1 Icon -->
    <linearGradient id="c1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Golden Luxury Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glassmorphic Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Base (Squircle) -->
  <rect x="80" y="80" width="640" height="640" rx="160" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4" filter="url(#softShadow)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="84" y="84" width="632" height="632" rx="156" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Background Decorative Radial Glow -->
  <circle cx="400" cy="400" r="180" fill="url(#c1Grad)" opacity="0.12" filter="url(#glow)"/>

  <!-- C1 Stylized Interlocked Emblem -->
  <g transform="translate(400, 395)" filter="url(#glow)">
    
    <!-- Outer Arc for "C" -->
    <path d="M 60 -130 
             A 150 150 0 1 0 60 130 
             L 10 95 
             A 110 110 0 1 1 10 -95 
             Z" 
          fill="url(#c1Grad)" />

    <!-- Core Dynamic "1" integrated in center-right -->
    <path d="M -25 -65 
             L 15 -105 
             L 50 -105 
             L 50 110 
             L 5 110 
             L 5 -60 
             Z" 
          fill="#FFFFFF" />

    <!-- Accent Dot / Speed Spark (Signifying instant hyperlocal speed) -->
    <circle cx="95" cy="-90" r="14" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography: CHURUONE -->
  <text x="400" y="625" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="10" 
        fill="#94A3B8" 
        text-anchor="middle">
    CHURU<tspan fill="#FFFFFF">ONE</tspan>
  </text>
</svg>
